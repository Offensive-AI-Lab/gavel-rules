name: rebuild-index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy key with write access; on the ruleset bypass list so this
          # push is allowed onto protected main.
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
      - name: Rebuild index.json
        run: uv run tools/build_index.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "Rebuild index.json"
            git push
          else
            echo "index.json already up to date"
          fi
